<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <defs>
    <!-- Multi-Tone Metallic Gold Zari Gradients -->
    <linearGradient id="zariGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#d97706" stop-opacity="0.92"/>
      <stop offset="85%" stop-color="#f59e0b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#92400e" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="zariSheen" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#fef9c3" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#ca8a04" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="zariGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0.5" stdDeviation="0.6" flood-color="#78350f" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#zariGlow)">
    <!-- 1. Interlocking Continuous Vine Creepers (Bel) for seamless repeat -->
    <path d="M 0 0 C 35 15, 45 45, 80 80" stroke="url(#zariGold)" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M 160 0 C 125 15, 115 45, 80 80" stroke="url(#zariGold)" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M 0 160 C 35 145, 45 115, 80 80" stroke="url(#zariGold)" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M 160 160 C 125 145, 115 115, 80 80" stroke="url(#zariGold)" stroke-width="2.6" stroke-linecap="round"/>

    <!-- Undulating secondary flowering vines -->
    <path d="M 80 0 C 60 25, 40 35, 20 45 C 5 50, 0 65, 0 80" stroke="url(#zariSheen)" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 80 0 C 100 25, 120 35, 140 45 C 155 50, 160 65, 160 80" stroke="url(#zariSheen)" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 80 160 C 60 135, 40 125, 20 115 C 5 110, 0 95, 0 80" stroke="url(#zariSheen)" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 80 160 C 100 135, 120 125, 140 115 C 155 110, 160 95, 160 80" stroke="url(#zariSheen)" stroke-width="1.8" stroke-linecap="round"/>

    <!-- 2. Central Mughal Blooming Rosette (Center Flower) -->
    <g transform="translate(80, 80)">
      <path d="M 0 0 C -8 -18, 8 -18, 0 0 Z" fill="url(#zariGold)" stroke="#b45309" stroke-width="0.6"/>
      <path d="M 0 0 C 18 -8, 18 8, 0 0 Z" fill="url(#zariGold)" stroke="#b45309" stroke-width="0.6"/>
      <path d="M 0 0 C -8 18, 8 18, 0 0 Z" fill="url(#zariGold)" stroke="#b45309" stroke-width="0.6"/>
      <path d="M 0 0 C -18 -8, -18 8, 0 0 Z" fill="url(#zariGold)" stroke="#b45309" stroke-width="0.6"/>

      <!-- Diagonal Petals -->
      <path d="M 0 0 C 6 -15, 15 -6, 0 0 Z" fill="url(#zariSheen)" stroke="#b45309" stroke-width="0.5"/>
      <path d="M 0 0 C 15 6, 6 15, 0 0 Z" fill="url(#zariSheen)" stroke="#b45309" stroke-width="0.5"/>
      <path d="M 0 0 C -6 15, -15 6, 0 0 Z" fill="url(#zariSheen)" stroke="#b45309" stroke-width="0.5"/>
      <path d="M 0 0 C -15 -6, -6 -15, 0 0 Z" fill="url(#zariSheen)" stroke="#b45309" stroke-width="0.5"/>

      <!-- Central Core Button & Stamen Ring -->
      <circle cx="0" cy="0" r="5" fill="#fef08a" stroke="#d97706" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="2.2" fill="#78350f"/>
    </g>

    <!-- 3. Corner Rosettes (Wrapping for seamless repeat) -->
    <g transform="translate(0, 0)">
      <path d="M 0 0 C 14 0, 14 14, 0 0 Z" fill="url(#zariGold)"/>
      <path d="M 0 0 C 0 14, 14 14, 0 0 Z" fill="url(#zariGold)"/>
      <circle cx="0" cy="0" r="4.5" fill="#fef08a" stroke="#d97706" stroke-width="1"/>
    </g>
    <g transform="translate(160, 0)">
      <path d="M 0 0 C -14 0, -14 14, 0 0 Z" fill="url(#zariGold)"/>
      <path d="M 0 0 C 0 14, -14 14, 0 0 Z" fill="url(#zariGold)"/>
      <circle cx="0" cy="0" r="4.5" fill="#fef08a" stroke="#d97706" stroke-width="1"/>
    </g>
    <g transform="translate(0, 160)">
      <path d="M 0 0 C 14 0, 14 -14, 0 0 Z" fill="url(#zariGold)"/>
      <path d="M 0 0 C 0 -14, 14 -14, 0 0 Z" fill="url(#zariGold)"/>
      <circle cx="0" cy="0" r="4.5" fill="#fef08a" stroke="#d97706" stroke-width="1"/>
    </g>
    <g transform="translate(160, 160)">
      <path d="M 0 0 C -14 0, -14 -14, 0 0 Z" fill="url(#zariGold)"/>
      <path d="M 0 0 C 0 -14, -14 -14, 0 0 Z" fill="url(#zariGold)"/>
      <circle cx="0" cy="0" r="4.5" fill="#fef08a" stroke="#d97706" stroke-width="1"/>
    </g>

    <!-- 4. Intermediate Meenakari Flower Buds & Vine Leaves -->
    <g transform="translate(80, 0)">
      <path d="M 0 0 C -9 14, 9 14, 0 0 Z" fill="url(#zariSheen)" stroke="#b45309" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="3" fill="#fef08a"/>
    </g>
    <g transform="translate(80, 160)">
      <path d="M 0 0 C -9 -14, 9 -14, 0 0 Z" fill="url(#zariSheen)" stroke="#b45309" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="3" fill="#fef08a"/>
    </g>
    <g transform="translate(0, 80)">
      <path d="M 0 0 C 14 -9, 14 9, 0 0 Z" fill="url(#zariSheen)" stroke="#b45309" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="3" fill="#fef08a"/>
    </g>
    <g transform="translate(160, 80)">
      <path d="M 0 0 C -14 -9, -14 9, 0 0 Z" fill="url(#zariSheen)" stroke="#b45309" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="3" fill="#fef08a"/>
    </g>

    <!-- Delicate Vine Leaves -->
    <path d="M 40 40 C 45 28, 55 35, 40 40 Z" fill="url(#zariGold)"/>
    <path d="M 38 42 C 28 45, 35 55, 38 42 Z" fill="url(#zariSheen)"/>
    <path d="M 120 40 C 115 28, 105 35, 120 40 Z" fill="url(#zariGold)"/>
    <path d="M 122 42 C 132 45, 125 55, 122 42 Z" fill="url(#zariSheen)"/>
    <path d="M 40 120 C 45 132, 55 125, 40 120 Z" fill="url(#zariGold)"/>
    <path d="M 38 118 C 28 115, 35 105, 38 118 Z" fill="url(#zariSheen)"/>
    <path d="M 120 120 C 115 132, 105 125, 120 120 Z" fill="url(#zariGold)"/>
    <path d="M 122 118 C 132 115, 125 105, 122 118 Z" fill="url(#zariSheen)"/>

    <!-- Micro Jacquard Stippling -->
    <circle cx="50" cy="70" r="1.4" fill="#fef08a"/>
    <circle cx="110" cy="70" r="1.4" fill="#fef08a"/>
    <circle cx="50" cy="90" r="1.4" fill="#fef08a"/>
    <circle cx="110" cy="90" r="1.4" fill="#fef08a"/>
    <circle cx="70" cy="50" r="1.4" fill="#fef08a"/>
    <circle cx="90" cy="50" r="1.4" fill="#fef08a"/>
    <circle cx="70" cy="110" r="1.4" fill="#fef08a"/>
    <circle cx="90" cy="110" r="1.4" fill="#fef08a"/>
  </g>
</svg>
