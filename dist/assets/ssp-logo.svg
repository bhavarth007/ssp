<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Royal Gold Gradient -->
    <linearGradient id="sspGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE89E" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#AA771C" />
      <stop offset="75%" stop-color="#E6C875" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>
    <!-- Background Radial Gradient -->
    <radialGradient id="sspBgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#241E15" />
      <stop offset="100%" stop-color="#0E0D0A" />
    </radialGradient>
    <!-- Glow filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Base -->
  <rect x="4" y="4" width="112" height="112" rx="26" fill="url(#sspBgGrad)" stroke="url(#sspGoldGrad)" stroke-width="2.5" />
  
  <!-- Subtle Textile Grid Watermark -->
  <g opacity="0.15" stroke="url(#sspGoldGrad)" stroke-width="0.75">
    <line x1="20" y1="35" x2="100" y2="35" />
    <line x1="20" y1="50" x2="100" y2="50" />
    <line x1="20" y1="65" x2="100" y2="65" />
    <line x1="20" y1="80" x2="100" y2="80" />
    <line x1="35" y1="20" x2="35" y2="100" />
    <line x1="50" y1="20" x2="50" y2="100" />
    <line x1="65" y1="20" x2="65" y2="100" />
    <line x1="80" y1="20" x2="80" y2="100" />
  </g>

  <!-- Circular Decorative Loom Ring -->
  <circle cx="60" cy="56" r="38" fill="none" stroke="url(#sspGoldGrad)" stroke-width="1.5" stroke-dasharray="4,2.5" />
  <circle cx="60" cy="56" r="41" fill="none" stroke="url(#sspGoldGrad)" stroke-width="0.75" />

  <!-- Textile Loom Shuttle Diamond Crests -->
  <path d="M60 18 L64 24 L60 30 L56 24 Z" fill="url(#sspGoldGrad)" />
  <path d="M60 82 L64 88 L60 94 L56 88 Z" fill="url(#sspGoldGrad)" />
  <path d="M22 56 L28 52 L34 56 L28 60 Z" fill="url(#sspGoldGrad)" />
  <path d="M86 56 L92 52 L98 56 L92 60 Z" fill="url(#sspGoldGrad)" />

  <!-- Monogram SSP (Sahjanand Polyweaves) -->
  <text 
    x="60" 
    y="66" 
    text-anchor="middle" 
    fill="url(#sspGoldGrad)" 
    font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" 
    font-size="28" 
    font-weight="900" 
    letter-spacing="2.5" 
    filter="url(#goldGlow)"
  >SSP</text>

  <!-- Bottom Brand Ribbon Banner -->
  <text 
    x="60" 
    y="104" 
    text-anchor="middle" 
    fill="url(#sspGoldGrad)" 
    font-family="'Inter', sans-serif" 
    font-size="6.5" 
    font-weight="700" 
    letter-spacing="1.8"
    opacity="0.9"
  >SAHJANAND</text>
</svg>
